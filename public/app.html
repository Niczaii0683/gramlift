<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | GramLift</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════
   GramLift app styles. Tokens are identical to the public landing page.
   Class names match the ones the script below already uses, so the app
   logic did not need to change.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --ink:#1c1917; --ink-2:#44403c; --ink-3:#78716c;
  --line:#e7e5e4; --paper:#ffffff; --paper-2:#faf9f7;
  --accent:#e8560e; --accent-ink:#b8420a; --accent-soft:#fff1e9;
  --grow:#15803d; --grow-soft:#ecfdf3;
  --warn:#b45309; --warn-soft:#fffbeb;
  --bad:#b91c1c; --bad-soft:#fef2f2;
  --grad:linear-gradient(135deg,#dc2626,#ea580c,#f59e0b);
  --r-sm:8px; --r:14px; --r-lg:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper-2);color:var(--ink);font-size:15px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Sora',sans-serif;letter-spacing:-.02em;line-height:1.2}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ─── TOP NAV ──────────────────────────────────────────────────────── */
.gnav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);height:68px;display:flex;align-items:center;padding:0 24px;gap:16px}
.logo{font-family:'Sora',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.03em;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--ink)}
.logo span{color:var(--ink)}
.logo::before{content:"";width:28px;height:28px;border-radius:9px;background:var(--grad);flex-shrink:0}

/* search */
.sw{display:flex;align-items:center;flex:1;max-width:400px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;transition:border-color .12s}
.sw:focus-within{border-color:var(--accent)}
.sw input{flex:1;border:none;outline:none;padding:11px 14px;font-size:14px;background:transparent}
.sbtn{padding:10px 16px;background:var(--accent);border:none;color:#fff;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .12s}
.sbtn:hover{background:var(--accent-ink)}

.nlnks{display:flex;gap:8px;margin-left:auto;align-items:center}
.nlnk{background:none;border:none;padding:9px 12px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;border-radius:9px}
.nlnk:hover{color:var(--ink);background:var(--paper-2)}
.nghost{background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.nghost:hover{background:var(--paper-2)}
.nprim{background:var(--accent);border:none;border-radius:11px;padding:10px 18px;font-size:14px;font-weight:600;color:#fff;cursor:pointer}
.nprim:hover{background:var(--accent-ink)}

/* cart button */
.cart-btn{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:8px;transition:border-color .12s,background .12s}
.cart-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.cart-count{background:var(--accent);color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* search preview dropdown */
.sprev{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 24px 48px -24px rgba(28,25,23,.35),0 2px 6px rgba(28,25,23,.06);z-index:500;min-width:320px}
.spav{width:38px;height:38px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0;font-family:'Sora',sans-serif}

/* ─── SHELL ────────────────────────────────────────────────────────── */
.shell{display:flex;min-height:calc(100vh - 68px)}
.sidebar{width:224px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto}
.nvsec{padding:16px 12px 4px}
.nvlbl{font-size:12px;font-weight:600;color:var(--ink-3);padding:4px 10px 8px;display:block}
.nvi{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border:none;background:none;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;text-align:left;transition:background .12s,color .12s;margin-bottom:2px}
.nvi svg{width:18px;height:18px;flex-shrink:0;stroke-width:1.9}
.nvi:hover{background:var(--paper-2);color:var(--ink)}
.nvi.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

.uftr{padding:14px;border-top:1px solid var(--line);margin-top:auto}
.avc{width:34px;height:34px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;font-family:'Sora',sans-serif}
.lout{margin-top:11px;width:100%;padding:8px;border:1.5px solid var(--line);background:#fff;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.lout:hover{background:var(--paper-2);color:var(--ink)}

.main{flex:1;padding:32px 34px 64px;overflow-y:auto;max-width:1080px}
.ptitle{font-family:'Sora',sans-serif;font-weight:700;font-size:26px;margin-bottom:5px}
.psub{color:var(--ink-2);font-size:15px;margin-bottom:26px}

/* ─── STAT CARDS ───────────────────────────────────────────────────── */
.srow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.sc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.sc.pr{background:var(--ink);border-color:var(--ink);color:#fff}
.slbl{font-size:13px;font-weight:500;color:var(--ink-3);margin-bottom:6px}
.sc.pr .slbl{color:#a8a29e}
.sval{font-family:'Sora',sans-serif;font-weight:700;font-size:28px;letter-spacing:-.02em}

/* ─── PACKAGE CARDS (match landing page exactly) ───────────────────── */
.bgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
.pkg{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 16px 18px;cursor:pointer;text-align:center;transition:border-color .14s,box-shadow .14s;position:relative;user-select:none}
.pkg:hover{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.pqty{font-family:'Sora',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em}
.plbl{font-size:13px;color:var(--ink-3);margin-bottom:10px}
.ppr{font-size:20px;font-weight:700;color:var(--accent-ink);margin-bottom:12px}
.porig{font-size:12px;color:var(--ink-3);text-decoration:line-through;min-height:16px}
.dbadge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.add-btn{width:100%;padding:9px;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-sm);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;transition:border-color .12s,background .12s}
.add-btn:hover{border-color:var(--ink)}
.add-btn.added{background:var(--accent);border-color:var(--accent);color:#fff}

/* inline username input on a package card */
.ig-inline{margin-top:9px;display:none}
.ig-inline.show{display:block}
.ig-inline input{width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:13px;outline:none;transition:border-color .12s}
.ig-inline input:focus{border-color:var(--accent)}
.ig-inline .confirm-btn{width:100%;margin-top:7px;padding:9px;background:var(--accent);border:none;border-radius:var(--r-sm);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.ig-inline .confirm-btn:hover{background:var(--accent-ink)}

/* ─── PLAN CARDS ───────────────────────────────────────────────────── */
.plgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.plcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;position:relative;transition:border-color .14s}
.plcard:hover{border-color:var(--accent)}
.plcard.pop{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.popbadge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:3px 12px;border-radius:999px;white-space:nowrap}

/* ─── CART ─────────────────────────────────────────────────────────── */
.cart-empty{text-align:center;padding:72px 20px}
.cart-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.cart-item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.cart-icon{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent-ink)}
.cart-icon svg{width:19px;height:19px;stroke-width:1.9}
.cart-remove{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;margin-left:auto;flex-shrink:0;border-radius:6px}
.cart-remove:hover{color:var(--bad);background:var(--bad-soft)}
.cart-total{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px}
.cart-total-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--ink-2)}
.cart-total-row.big{font-family:'Sora',sans-serif;font-weight:700;font-size:19px;color:var(--accent-ink);border-top:1px solid var(--line);margin-top:10px;padding-top:14px}

/* ─── CHECKOUT ─────────────────────────────────────────────────────── */
.checkout-wrap{max-width:560px}
.chk-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 26px;margin-bottom:16px}
.steps{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px;background:#fff}
.step{flex:1;padding:12px 8px;text-align:center;font-size:12px;font-weight:500;color:var(--ink-3)}
.step.done{color:var(--grow);background:var(--grow-soft)}
.step.active{color:var(--accent-ink);background:var(--accent-soft);font-weight:600}
.stepn{display:block;font-family:'Sora',sans-serif;font-weight:700;font-size:16px;margin-bottom:2px}

/* form fields */
.fl{margin-bottom:14px}
.fl label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.fl input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;font-size:15px;outline:none;transition:border-color .12s}
.fl input:focus{border-color:var(--accent)}
.fl input.ferr{border-color:var(--bad)}
.ferrtxt{font-size:12px;color:var(--bad);margin-top:4px}

/* payment box */
.pay-box{background:var(--grow-soft);border:1px solid #86efac;border-radius:var(--r);padding:15px 17px;margin-bottom:14px;display:flex;align-items:center;gap:13px}
.pay-cards{display:flex;gap:5px;margin-top:5px}
.pcb{font-size:9px;font-weight:700;padding:3px 7px;border-radius:4px;color:#fff;letter-spacing:.02em}
.pcb.visa{background:#1a1f71}
.pcb.mc{background:#eb001b}
.pcb.amex{background:#007bc1}

/* ─── BUTTONS ──────────────────────────────────────────────────────── */
.cta{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;transition:background .12s}
.cta:hover{background:var(--accent-ink)}
.cta:disabled{opacity:.5;cursor:not-allowed}
.cta.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.cta.ghost:hover{background:var(--paper-2)}

/* ─── ORDERS ───────────────────────────────────────────────────────── */
.olist{display:flex;flex-direction:column;gap:9px}
.orow{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.oicon{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent-ink)}
.oicon svg{width:18px;height:18px;stroke-width:1.9}
.badge{border-radius:6px;padding:3px 9px;font-size:11px;font-weight:600}
.badge.fulfilled{background:var(--grow-soft);color:var(--grow)}
.badge.pending,.badge.processing{background:var(--warn-soft);color:var(--warn)}
.badge.failed{background:var(--bad-soft);color:var(--bad)}

/* ─── TIP / NOTES ──────────────────────────────────────────────────── */
.tip{background:var(--accent-soft);border:1px solid #fed7aa;border-radius:var(--r-sm);padding:11px 14px;font-size:13px;color:var(--accent-ink);margin-bottom:14px}

/* ─── CHARTS ───────────────────────────────────────────────────────── */
.charts2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.chtcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px}
.ctabs{display:flex;gap:3px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.ctab{flex:1;padding:6px 12px;border:none;background:transparent;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.ctab.active{background:#fff;color:var(--accent-ink);font-weight:600;box-shadow:0 1px 3px rgba(28,25,23,.08)}

.igbanner{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 26px;margin-bottom:22px}
.igsts{display:flex;gap:0;flex:1}
.igst{flex:1;text-align:center;padding:0 16px;border-right:1px solid var(--line)}
.igst:last-child{border-right:none}
.igstv{font-family:'Sora',sans-serif;font-weight:700;font-size:21px;letter-spacing:-.02em}
.igstl{font-size:12px;color:var(--ink-3);margin-top:2px}

.cmrow{display:flex;gap:18px;margin-bottom:14px;flex-wrap:wrap}
.cm{font-size:12px;color:var(--ink-3)}
.cm strong{display:block;font-family:'Sora',sans-serif;font-weight:700;font-size:19px;color:var(--ink);letter-spacing:-.02em}
.eleg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.eli{display:flex;align-items:center;gap:8px;font-size:12px}
.eld{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* ─── SETTINGS ─────────────────────────────────────────────────────── */
.setcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 26px;margin-bottom:14px}
.setcard h3{font-size:17px;font-weight:700;margin-bottom:16px}
.savebtn{padding:11px 22px;background:var(--accent);color:#fff;border:none;border-radius:11px;font-weight:600;cursor:pointer;font-size:14px}
.savebtn:hover{background:var(--accent-ink)}

/* ─── MISC ─────────────────────────────────────────────────────────── */
.spin{width:16px;height:16px;border:2px solid #fed7aa;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;border-radius:12px;padding:13px 18px;font-size:14px;font-weight:500;z-index:9999;max-width:320px;box-shadow:0 20px 40px -20px rgba(28,25,23,.5);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* ─── LOGIN ────────────────────────────────────────────────────────── */
.login-wrap{min-height:100vh;background:var(--paper-2);display:flex;flex-direction:column}
.lnav{background:#fff;border-bottom:1px solid var(--line);height:68px;display:flex;align-items:center;padding:0 26px}
.lctr{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:34px 30px;width:100%;max-width:410px;box-shadow:0 24px 56px -32px rgba(28,25,23,.3)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:22px}
.ltab{flex:1;background:none;border:none;padding:11px 0;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.ltab.active{color:var(--accent-ink);border-bottom-color:var(--accent)}
.subbtn{width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;margin-bottom:16px}
.subbtn:hover{background:var(--accent-ink)}
.gbtn{width:100%;padding:12px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.gbtn:hover{background:var(--paper-2)}

/* ─── RESPONSIVE ───────────────────────────────────────────────────── */
@media(max-width:1000px){.bgrid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){.bgrid{grid-template-columns:repeat(3,1fr)}.charts2{grid-template-columns:1fr}}
@media(max-width:700px){
  .sidebar{display:none}
  .main{padding:20px 16px 48px}
  .srow{grid-template-columns:1fr 1fr}
  .bgrid{grid-template-columns:1fr 1fr}
  .gnav{padding:0 16px;gap:10px}
  .nlnk{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ─── PRICES — edit these to change what customers pay ────────────────────────
// When you change a price here, also change the matching price in server/index.js
// Both files must always have the same prices.
const PACKAGES=[
  {qty:100,   price:8.99,    base:8.99,    disc:0},
  {qty:250,   price:20.40,   base:21.47,   disc:5},
  {qty:500,   price:38.37,   base:40.39,   disc:5},
  {qty:1000,  price:72.99,   base:74.99,   disc:3},
  {qty:2000,  price:132.99,  base:139.99,  disc:5},
  {qty:5000,  price:279.99,  base:299.99,  disc:7},
  {qty:10000, price:485.99,  base:539.99,  disc:10},
  {qty:20000, price:866.99,  base:1019.99, disc:15},
  {qty:50000, price:1919.99, base:2399.99, disc:20},
  {qty:100000,price:3374.99, base:4499.99, disc:25},
];
const PLANS=[
  {id:"starter",name:"Starter",price:19,popular:false,desc:"500 followers/mo",features:["500 real followers / month","Audience targeting","Basic analytics","Email support"]},
  {id:"creator",name:"Creator",price:49,popular:true, desc:"1,500 followers/mo",features:["1,500 real followers / month","Advanced targeting","Priority growth","Live analytics","Chat support"]},
  {id:"pro",    name:"Pro",    price:99,popular:false,desc:"4,000 followers/mo",features:["4,000 real followers / month","Elite targeting","Account manager","Full analytics","24/7 support"]},
];
// ─────────────────────────────────────────────────────────────────────────────

const MOCK_USER={email:"",instagram_handle:"",credit_balance:0};
const MOCK_ORDERS=[];
const fmt=n=>"$"+Number(n).toFixed(2);
const fmtK=n=>n>=1000?(n/1000)+"K":""+n;
const fmtDate=s=>new Date(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const fmtNum=n=>n>=1000?(n/1000).toFixed(1)+"K":""+n;
const SVG=(d)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON_USERS  = SVG('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>');
const ICON_TREND  = SVG('<path d="M3 17l6-6 4 4 7-7"/><path d="M14 7h6v6"/>');
const ICON_PLAN   = SVG('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>');
const ICONS = {100:ICON_USERS,250:ICON_USERS,500:ICON_USERS,1000:ICON_TREND,2000:ICON_TREND,5000:ICON_TREND,10000:ICON_TREND,20000:ICON_TREND,50000:ICON_TREND,100000:ICON_TREND};

// ─── STATE ────────────────────────────────────────────────────────────────────
let S={
  page:"login",ltab:"login",loginErr:"",user:null,orders:[...MOCK_ORDERS],
  tab:"overview",
  // Cart: array of {id, type, qty, instagram, planId, name, price}
  cart:[],

// ─── MOCK IG LOOKUP ────────────────────────────────────────────────────────────
function mockIG(h){
  h=(h||"nicc_yeo").replace("@","").toLowerCase();
  const seed=h.split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  const f=800+((seed*137)%8000),fo=300+((seed*89)%2000),p=10+((seed*23)%300);
  return{handle:h,name:h[0].toUpperCase()+h.slice(1).replace(/_/g," "),
    followers:f,following:fo,posts:p,
    engagementSources:{organic:Math.round(f*.74),discover:Math.round(f*.14),search:Math.round(f*.07),dm:Math.round(f*.02),hashtags:Math.round(f*.05)},
    engagementTrend:[12,18,15,22,19,27,24].map(v=>Math.round(v*(seed%5+3))),
    totalEngagements:Math.round(f*.15),postViewsDay:Math.round(f*.09),profileViewsDay:Math.round(f*.09),reached:Math.round(f*.06),
  };
}

// ─── CHARTS ────────────────────────────────────────────────────────────────────
let _ch={};
function dc(id){if(_ch[id]){_ch[id].destroy();delete _ch[id];}}
function projGrowth(base,period){
  const n=period==="daily"?8:period==="weekly"?5:4;
  const labels=[],core=[],elite=[],none=[];
  const now=new Date();
  for(let i=0;i<n;i++){
    const d=new Date(now);
    if(period==="daily")d.setDate(d.getDate()+i);
    else if(period==="weekly")d.setDate(d.getDate()+i*7);
    else d.setMonth(d.getMonth()+i);
    labels.push(period==="daily"?d.toLocaleDateString("en-US",{month:"short",day:"numeric"}):period==="weekly"?"Wk "+(i+1):"Mo "+(i+1));
    const cm=period==="daily"?.05:period==="weekly"?.35:1.5,em=cm*1.9,nm=cm*.1;
    core.push(Math.round(base*(1+cm*i)));elite.push(Math.round(base*(1+em*i)));none.push(Math.round(base*(1+nm*i)));
  }
  return{labels,core,elite,none};
}
function initGC(p){dc("g");const ctx=document.getElementById("gChart");if(!ctx)return;const d=projGrowth(p.followers,S.chartPeriod);_ch.g=new Chart(ctx,{type:"line",data:{labels:d.labels,datasets:[{label:"Starter",data:d.core,borderColor:"#dc2626",backgroundColor:"rgba(220,38,38,.07)",pointBackgroundColor:"#dc2626",tension:.4,pointRadius:4,borderWidth:2.5},{label:"Pro",data:d.elite,borderColor:"#f59e0b",backgroundColor:"rgba(245,158,11,.05)",pointBackgroundColor:"#f59e0b",tension:.4,pointRadius:4,borderWidth:2.5},{label:"Without",data:d.none,borderColor:"#d1d5db",backgroundColor:"transparent",pointBackgroundColor:"#9ca3af",tension:.4,pointRadius:3,borderWidth:1.5,borderDash:[4,4]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:"rgba(0,0,0,.03)"},ticks:{font:{size:10}}},y:{grid:{color:"rgba(0,0,0,.03)"},ticks:{font:{size:10},callback:v=>fmtNum(v)}}}}});}
function initDC(p){dc("d");const ctx=document.getElementById("dChart");if(!ctx)return;const es=p.engagementSources;_ch.d=new Chart(ctx,{type:"doughnut",data:{labels:["Organic","Discover","Search","DM","Hashtags"],datasets:[{data:[es.organic,es.discover,es.search,es.dm,es.hashtags],backgroundColor:["#dc2626","#ea580c","#f59e0b","#6366f1","#22c55e"],borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,cutout:"68%",plugins:{legend:{display:false}}}});}
function initBC(p){dc("b");const ctx=document.getElementById("bChart");if(!ctx)return;_ch.b=new Chart(ctx,{type:"bar",data:{labels:["Day 1","Day 2","Day 3","Day 4","Day 5","Day 6","Day 7"],datasets:[{data:p.engagementTrend,backgroundColor:"#22c55e",borderRadius:7,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{display:false}}}});}

async function doSearch(){
  const h=S.searchVal.trim().replace(/^@/,"").toLowerCase();
  if(!h)return;
  set({searchLoading:true,showPrev:false,searchResult:null,searchError:null});
  try{
    // Call backend which proxies to Instagram scraper API
    const res=await fetch("/api/ig-profile?username="+encodeURIComponent(h));
    const data=await res.json();
    if(data.error){
      // Fall back to mock data with a note
      const mock=mockIG(h);
      mock.isMock=true;
      set({searchLoading:false,searchResult:mock,showPrev:true});
    } else {
      set({searchLoading:false,searchResult:data,showPrev:true});
    }
  }catch(e){
    // Network error — use mock
    const mock=mockIG(h);
    mock.isMock=true;
    set({searchLoading:false,searchResult:mock,showPrev:true});
  }
}

  <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;padding:9px 12px;font-size:12px;color:#1e40af;margin-bottom:12px;">
    Every order is recorded at <b>gramlift.onrender.com/api/orders</b> — bookmark this to track all purchases. You can also verify delivery in your SocialLegend dashboard.
  </div>

  ${S.chkLoading
    ?`<button class="cta" disabled><span class="spin"></span> Redirecting to Stripe...</button>`
    :`<button class="cta" onclick="submitCartOrder()">Pay ${fmt(total)} with Card →</button>`}

  <button class="cta ghost" onclick="set({chkStep:1})" style="margin-top:9px">← Back to Cart</button>
</div>`;
}

async function submitCartOrder(){
  if(S.cart.length===0){alert("Your cart is empty.");return;}
  set({chkLoading:true});
  try{
    const res=await fetch('/api/create-checkout',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:'cart',cart:S.cart}),
    });
    const data=await res.json();
    if(data.url){
      window.location.href=data.url;
    } else {
      alert('Error: '+(data.error||'Could not start checkout. Is the server running?'));
      set({chkLoading:false});
    }
  }catch(err){
    alert('Cannot reach server. Make sure it is running.');
    set({chkLoading:false});
  }
}

function renderLogin(){
  const err=S.loginErr||"";
  return`<div class="login-wrap">

      </div>
      <div style="font-size:12px;color:var(--muted)">${S.ltab==="login"?"Sign in to manage your orders":"Start growing your Instagram today"}</div>
    </div>
    <div class="tabs">
      <button class="ltab${S.ltab==="login"?" active":""}" onclick="set({ltab:'login',loginErr:''})">Log In</button>
      <button class="ltab${S.ltab==="signup"?" active":""}" onclick="set({ltab:'signup',loginErr:''})">Sign Up</button>

        onfocus="this.style.borderColor='#ea580c'"
        onblur="this.style.borderColor='var(--border)'"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="fl"><label>Password ${S.ltab==="signup"?"(min 6 characters)":""}</label>
      <div style="position:relative">
        <input id="pw" type="password" placeholder="••••••••"
          style="width:100%;border:1.5px solid var(--border);border-radius:9px;padding:10px 40px 10px 12px;font-size:14px;font-family:inherit;outline:none;"
          onfocus="this.style.borderColor='#ea580c'"
          onblur="this.style.borderColor='var(--border)'"
          onkeydown="if(event.key==='Enter')doLogin()">
        <span onclick="togglePw('pw',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;user-select:none;">👁</span>
      </div>
    </div>
    ${S.ltab==="signup"?`
    <div class="fl"><label>Confirm password</label>
      <div style="position:relative">
        <input id="pw2" type="password" placeholder="••••••••"
          style="width:100%;border:1.5px solid var(--border);border-radius:9px;padding:10px 40px 10px 12px;font-size:14px;font-family:inherit;outline:none;"
          onfocus="this.style.borderColor='#ea580c'"
          onblur="this.style.borderColor='var(--border)'"
          onkeydown="if(event.key==='Enter')doLogin()">
        <span onclick="togglePw('pw2',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;user-select:none;">👁</span>

}

function togglePw(inputId,icon){
  const input=document.getElementById(inputId);
  if(!input)return;
  if(input.type==="password"){input.type="text";icon.textContent="🙈";}
  else{input.type="password";icon.textContent="👁";}
}

function validateEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}

function doLogin(){
  const em=(document.getElementById("em")?.value||"").trim();
  const pw=document.getElementById("pw")?.value||"";
  const pw2=document.getElementById("pw2")?.value||"";

  if(!em){set({loginErr:"Please enter your email address."});return;}
  if(!validateEmail(em)){set({loginErr:"Please enter a valid email address (e.g. you@gmail.com)."});return;}
  if(!pw){set({loginErr:"Please enter a password."});return;}
  if(pw.length<6){set({loginErr:"Password must be at least 6 characters."});return;}

  if(S.ltab==="signup"){
    if(!pw2){set({loginErr:"Please confirm your password."});return;}
    if(pw!==pw2){set({loginErr:"Passwords do not match."});return;}
    // Register new user — send to backend
    registerUser(em,pw);
    return;
  }

  // Login — send to backend
  loginUser(em,pw);
}

async function loginUser(em,pw){
  try{
    const res=await fetch("/api/auth/login",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:em,password:pw}),
    });
    const data=await res.json();
    if(data.error){set({loginErr:data.error});return;}
    set({page:"app",user:data.user,loginErr:""});
    toast("Welcome back, "+data.user.email.split("@")[0]+"!");
  }catch(e){
    // Backend auth not set up yet — use mock login
    set({page:"app",user:{...MOCK_USER,email:em},loginErr:""});
  }
}

async function registerUser(em,pw){
  try{
    const res=await fetch("/api/auth/register",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:em,password:pw}),
    });
    const data=await res.json();
    if(data.error){set({loginErr:data.error});return;}
    set({page:"app",user:data.user,loginErr:""});
    toast("Account created! Welcome to GramLift ");
  }catch(e){
    // Backend auth not set up yet — use mock
    set({page:"app",user:{...MOCK_USER,email:em},loginErr:""});
  }
}

function googleLogin(){
  // Redirect to backend Google OAuth
  window.location.href="/api/auth/google";
}

render();
</script>

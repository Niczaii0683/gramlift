<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order | GramLift</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens are identical to the public landing page so the two feel like one site. */
:root{
  --ink:#1c1917; --ink-2:#44403c; --ink-3:#78716c;
  --line:#e7e5e4; --paper:#fff; --paper-2:#faf9f7;
  --accent:#e8560e; --accent-ink:#b8420a; --accent-soft:#fff1e9;
  --grow:#15803d; --grow-soft:#ecfdf3;
  --bad:#b91c1c; --bad-soft:#fef2f2;
  --warn:#b45309; --warn-soft:#fffbeb;
  --grad:linear-gradient(135deg,#dc2626,#ea580c,#f59e0b);
  --r-sm:8px; --r:14px; --r-lg:22px; --max:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper-2);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Sora',sans-serif;letter-spacing:-.02em;line-height:1.2}
a{color:inherit;text-decoration:none}
button,input,select{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── nav ── */
.nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{height:68px;display:flex;align-items:center;gap:28px}
.brand{font-family:'Sora',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--grad);position:relative;flex-shrink:0}
.brand-mark::after{content:"";position:absolute;left:9px;bottom:8px;width:12px;height:12px;border-right:3px solid #fff;border-top:3px solid #fff;transform:rotate(-45deg) translate(2px,2px)}
.tabs{display:flex;gap:4px}
.tab{background:none;border:none;padding:9px 14px;font-size:15px;font-weight:500;color:var(--ink-2);cursor:pointer;border-radius:10px}
.tab:hover{background:var(--paper-2);color:var(--ink)}
.tab.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.cartbtn{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
.cartbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.cartbtn .n{background:var(--accent);color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.burger{display:none;margin-left:auto;background:none;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer}

/* ── page ── */
main{padding:36px 0 80px}
.ptitle{font-family:'Sora',sans-serif;font-weight:700;font-size:28px;margin-bottom:6px}
.psub{color:var(--ink-2);font-size:16px;margin-bottom:28px;max-width:620px}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;font-weight:600;font-size:15px;border:1.5px solid transparent;cursor:pointer;transition:background .12s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--paper-2)}
.btn-full{width:100%}

/* ── product chooser (Post Boost) ── */
.chooser{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:840px}
.choice{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 24px;cursor:pointer;text-align:left;transition:border-color .14s,box-shadow .14s}
.choice:hover{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.choice .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:16px}
.choice .ic svg{width:22px;height:22px;stroke-width:1.9}
.choice h3{font-size:19px;margin-bottom:6px}
.choice p{font-size:14px;color:var(--ink-2);margin-bottom:12px}
.choice .from{font-size:13px;font-weight:600;color:var(--accent-ink)}
.backlink{background:none;border:none;color:var(--ink-2);font-size:14px;font-weight:500;cursor:pointer;padding:6px 0;margin-bottom:14px}
.backlink:hover{color:var(--ink)}

/* ── package grid ── */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.grid.six{grid-template-columns:repeat(6,1fr)}
.pk{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 14px 16px;text-align:center;position:relative;transition:border-color .14s,box-shadow .14s}
.pk:hover{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.pk.open{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.pk .tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pk .q{font-family:'Sora',sans-serif;font-weight:800;font-size:25px;letter-spacing:-.02em}
.pk .l{font-size:13px;color:var(--ink-3);margin-bottom:8px}
.pk .was{font-size:12px;color:var(--ink-3);text-decoration:line-through;min-height:16px}
.pk .p{font-size:19px;font-weight:700;color:var(--accent-ink);margin-bottom:12px}
.pk .sel{width:100%;padding:9px;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.pk .sel:hover{border-color:var(--ink)}
.pk .sel.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pk .incart{font-size:11px;color:var(--grow);font-weight:600;margin-top:6px}

/* inline form inside a card */
.inline{margin-top:10px;text-align:left}
.inline label{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.inline select,.inline input{width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;outline:none;background:#fff;margin-bottom:7px}
.inline select:focus,.inline input:focus{border-color:var(--accent)}
.inline input.err{border-color:var(--bad)}
.inline .go{width:100%;padding:9px;background:var(--accent);border:none;border-radius:var(--r-sm);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.inline .go:hover{background:var(--accent-ink)}
.inline .msg{font-size:11px;color:var(--bad);margin:-3px 0 6px}

/* ── bulk note ── */
.bulk{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.bulk b{display:block;font-size:15px;margin-bottom:2px}
.bulk span{font-size:14px;color:var(--ink-2)}

/* ── sticky cart bar ── */
.cartbar{position:sticky;bottom:16px;background:var(--ink);color:#fff;border-radius:var(--r);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:22px;box-shadow:0 20px 40px -20px rgba(28,25,23,.5)}
.cartbar span{font-size:14px;font-weight:500}
.cartbar button{background:#fff;color:var(--ink);border:none;border-radius:10px;padding:10px 20px;font-weight:600;font-size:14px;cursor:pointer}

/* ── cart ── */
.narrow{max-width:620px}
.items{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px}
.item .ic{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.item .ic svg{width:19px;height:19px;stroke-width:1.9}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14px;font-weight:600}
.item .t span{font-size:13px;color:var(--ink-3);word-break:break-all}
.item .pr{font-weight:700;font-size:15px;color:var(--accent-ink);white-space:nowrap}
.item .x{background:none;border:none;color:var(--ink-3);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px}
.item .x:hover{color:var(--bad);background:var(--bad-soft)}
.totals{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px}
.trow{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--ink-2)}
.trow.big{font-family:'Sora',sans-serif;font-weight:700;font-size:19px;color:var(--accent-ink);border-top:1px solid var(--line);margin-top:10px;padding-top:14px}
.empty{text-align:center;padding:72px 20px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg)}
.empty h3{font-size:19px;margin:14px 0 8px}
.empty p{color:var(--ink-2);margin-bottom:22px}

/* ── forms ── */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 26px;margin-bottom:16px}
.card h3{font-size:18px;margin-bottom:16px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:15px;outline:none}
.field input:focus{border-color:var(--accent)}
.field input.err{border-color:var(--bad)}
.field .hint{font-size:12px;color:var(--ink-3);margin-top:5px}
.field .bad{font-size:12px;color:var(--bad);margin-top:5px}

/* ── saved handles ── */
.handles{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.handle{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;background:var(--paper-2)}
.handle b{flex:1;font-size:14px;font-weight:600}
.handle button{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:13px;font-weight:500;padding:4px 8px;border-radius:6px}
.handle button:hover{color:var(--bad);background:var(--bad-soft)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px;outline:none}
.addrow input:focus{border-color:var(--accent)}

/* ── misc ── */
.pay{background:var(--grow-soft);border:1px solid #86efac;border-radius:var(--r);padding:15px 17px;margin-bottom:16px;display:flex;align-items:center;gap:13px}
.pcb{font-size:9px;font-weight:700;padding:3px 7px;border-radius:4px;color:#fff}
.pcb.v{background:#1a1f71}.pcb.m{background:#eb001b}.pcb.a{background:#007bc1}
.note{background:var(--accent-soft);border:1px solid #fed7aa;border-radius:var(--r-sm);padding:11px 14px;font-size:13px;color:var(--accent-ink);margin-bottom:16px}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:13px 20px;font-size:14px;font-weight:500;z-index:999;box-shadow:0 20px 40px -20px rgba(28,25,23,.5);animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

@media(max-width:980px){.grid,.grid.six{grid-template-columns:repeat(4,1fr)}.chooser{grid-template-columns:1fr}}
@media(max-width:760px){
  .tabs{display:none}.burger{display:block}
  .nav.open .tabs{display:flex;position:absolute;top:68px;left:0;right:0;background:#fff;flex-direction:column;padding:12px 24px;gap:4px;border-bottom:1px solid var(--line)}
  .nav-right{margin-left:0}
  .grid,.grid.six{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap">
    <a class="brand" href="/"><span class="brand-mark"></span>GramLift</a>
    <nav class="tabs" id="tabs"></nav>
    <button class="burger" onclick="document.getElementById('nav').classList.toggle('open')">Menu</button>
    <div class="nav-right">
      <button class="cartbtn" onclick="go('cart')" id="cartBtn"></button>
    </div>
  </div>
</header>

<main><div class="wrap" id="page"></div></main>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   PRICES
   These are a fallback. On load the app fetches /api/products and uses
   whatever the server says, so server/index.js is the single source of
   truth. Keep these in step anyway so the page still works if the API
   call fails.
   ═══════════════════════════════════════════════════════════════════════ */
let PRODUCTS = {
  followers:{label:"Instagram Followers",linkType:"profile",tiers:{100:3,250:7,500:13,1000:25,2000:48,5000:110,10000:210,20000:415,50000:1010,100000:2000}},
  likes:    {label:"Instagram Likes",    linkType:"post",   tiers:{100:2,250:5,500:10,1000:20,2500:50,5000:100}},
  views:    {label:"Instagram Views",    linkType:"post",   tiers:{100:1,500:5,1000:10,5000:50,10000:100,25000:250}},
  shares:   {label:"Instagram Shares",   linkType:"post",   tiers:{100:1,250:2.5,500:5,1000:10,2500:25,5000:50}},
};
let SUPPORT_EMAIL = "support@gramlift.com";

/* Full price at the smallest tier's rate, used for the crossed-out number */
const RATE = {followers:0.03, likes:0.02, views:0.01, shares:0.01};
const POPULAR = {followers:1000, likes:1000, views:5000, shares:1000};

/* ═══════════════════════════════════════════════════════════════════════
   STATE
   Cart and saved handles persist in this browser only. No account, no
   password, nothing personal on our servers until checkout.
   ═══════════════════════════════════════════════════════════════════════ */
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem("gl_"+k)) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem("gl_"+k, JSON.stringify(v)); } catch {} },
};

let S = {
  page:   "followers",
  boost:  null,            // which post product is open: likes | views | shares
  cart:   store.get("cart", []),
  handles:store.get("handles", []),
  open:   null,            // "followers:1000" — which card has its form showing
  email:  store.get("email", ""),
  busy:   false,
  toast:  null,
};

function set(p){ Object.assign(S, p); if ("cart" in p) store.set("cart", S.cart); if ("handles" in p) store.set("handles", S.handles); if ("email" in p) store.set("email", S.email); render(); }
function go(page){ set({page, boost:null, open:null}); window.scrollTo({top:0}); document.getElementById("nav").classList.remove("open"); }
function toast(m){ set({toast:m}); setTimeout(()=>set({toast:null}), 3200); }

const money = n => "$" + (Number(n) % 1 === 0 ? Number(n).toFixed(0) : Number(n).toFixed(2));
const kk    = n => n >= 1000 ? (n/1000) + "K" : String(n);
const num   = n => Number(n).toLocaleString("en-US");
const total = () => S.cart.reduce((s,i)=>s+i.price, 0);

/* ── icons ── */
const ico = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  users:  ico('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'),
  heart:  ico('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/>'),
  play:   ico('<circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z"/>'),
  share:  ico('<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/>'),
  cart:   ico('<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h2.5l2.2 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 7H5.5"/>'),
};
const PROD_ICON = {followers:I.users, likes:I.heart, views:I.play, shares:I.share};

/* ═══════════════════════════════════════════════════════════════════════
   VALIDATION — mirrors the checks in server/index.js
   ═══════════════════════════════════════════════════════════════════════ */
const USERNAME_RE = /^[a-zA-Z0-9_.]{1,30}$/;
const POST_RE     = /^https?:\/\/(www\.)?instagram\.com\/(p|reel|reels|tv)\/[A-Za-z0-9_-]+\/?/i;
const EMAIL_RE    = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const cleanUser   = v => String(v||"").trim().replace(/^@/,"").toLowerCase();

/* ═══════════════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════════════ */
function render(){
  const TABS = [["followers","Followers"],["boost","Post Boost"],["settings","Saved accounts"]];
  document.getElementById("tabs").innerHTML = TABS.map(([k,l]) =>
    `<button class="tab${S.page===k?" on":""}" onclick="go('${k}')">${l}</button>`).join("");

  const n = S.cart.length;
  document.getElementById("cartBtn").innerHTML = `${I.cart}<span style="margin-left:-2px">Cart</span>${n?`<span class="n">${n}</span>`:""}`;

  const views = {followers:pageFollowers, boost:pageBoost, cart:pageCart, checkout:pageCheckout, settings:pageSettings};
  document.getElementById("page").innerHTML = `<div class="fade">${(views[S.page]||pageFollowers)()}</div>`;

  document.querySelectorAll(".toast").forEach(e=>e.remove());
  if (S.toast) document.body.insertAdjacentHTML("beforeend", `<div class="toast">${S.toast}</div>`);

  // focus the field that just appeared
  if (S.open){
    const el = document.getElementById("in_"+S.open.replace(":","_"));
    if (el) el.focus();
  }
}

/* ── shared: the package grid for one product ── */
function grid(type){
  const p = PRODUCTS[type], tiers = Object.entries(p.tiers);
  const six = tiers.length <= 6 ? " six" : "";
  return `<div class="grid${six}">${tiers.map(([q, price]) => {
    const qty  = Number(q);
    const key  = `${type}:${qty}`;
    const open = S.open === key;
    const was  = qty * RATE[type];
    const inCart = S.cart.filter(i => i.type===type && i.qty===qty).length;
    return `<div class="pk${open?" open":""}">
      ${POPULAR[type]===qty?'<span class="tag">Most popular</span>':""}
      <div class="q">${kk(qty)}</div>
      <div class="l">${type==="followers"?"followers":type}</div>
      <div class="was">${was > price + 0.009 ? money(was) : ""}</div>
      <div class="p">${money(price)}</div>
      <button class="sel${open?" on":""}" onclick="toggle('${key}')">${open?"Cancel":"Select"}</button>
      ${open ? form(type, qty) : ""}
      ${inCart?`<div class="incart">${inCart} in cart</div>`:""}
    </div>`;
  }).join("")}</div>`;
}

/* ── the inline form inside an opened card ── */
function form(type, qty){
  const id  = `${type}_${qty}`;
  const err = S.err && S.err.key === `${type}:${qty}` ? S.err.msg : "";

  if (PRODUCTS[type].linkType === "profile"){
    const saved = S.handles;
    return `<div class="inline">
      ${saved.length ? `
        <label for="sel_${id}">Account</label>
        <select id="sel_${id}" onchange="pick('${id}', this.value)">
          ${saved.map(h=>`<option value="${h}">@${h}</option>`).join("")}
          <option value="__new">Use another account…</option>
        </select>
        <div id="new_${id}" style="display:none">
          <input id="in_${id}" type="text" placeholder="username" autocomplete="off"
                 onkeydown="if(event.key==='Enter')addItem('${type}',${qty})">
        </div>`
      : `<label for="in_${id}">Instagram username</label>
         <input id="in_${id}" type="text" placeholder="username" autocomplete="off"
                onkeydown="if(event.key==='Enter')addItem('${type}',${qty})">`}
      ${err?`<div class="msg">${err}</div>`:""}
      <button class="go" onclick="addItem('${type}',${qty})">Add to cart</button>
    </div>`;
  }

  return `<div class="inline">
    <label for="in_${id}">Post or reel link</label>
    <input id="in_${id}" type="url" placeholder="instagram.com/p/…" autocomplete="off"
           onkeydown="if(event.key==='Enter')addItem('${type}',${qty})">
    ${err?`<div class="msg">${err}</div>`:""}
    <button class="go" onclick="addItem('${type}',${qty})">Add to cart</button>
  </div>`;
}

function toggle(key){ set({open: S.open===key ? null : key, err:null}); }

function pick(id, val){
  const box = document.getElementById("new_"+id);
  if (!box) return;
  box.style.display = val === "__new" ? "block" : "none";
  if (val === "__new") document.getElementById("in_"+id)?.focus();
}

function addItem(type, qty){
  const id = `${type}_${qty}`;
  const key = `${type}:${qty}`;
  const p  = PRODUCTS[type];
  const price = p.tiers[qty];

  if (p.linkType === "profile"){
    const sel   = document.getElementById("sel_"+id);
    const input = document.getElementById("in_"+id);
    let user = sel && sel.value !== "__new" ? sel.value : cleanUser(input?.value);
    if (!user)                    return set({err:{key, msg:"Enter an Instagram username."}});
    if (!USERNAME_RE.test(user))  return set({err:{key, msg:"Letters, numbers, dots and underscores only."}});

    const handles = S.handles.includes(user) ? S.handles : [...S.handles, user].slice(0, 20);
    set({
      cart: [...S.cart, {id:Date.now()+"", type, qty, price, instagram:user, shown:"@"+user}],
      handles, open:null, err:null,
    });
    return toast(`${num(qty)} followers for @${user} added`);
  }

  const url = String(document.getElementById("in_"+id)?.value || "").trim();
  if (!url)                return set({err:{key, msg:"Paste the link to your post."}});
  if (!POST_RE.test(url))  return set({err:{key, msg:"Needs to be a post or reel link, not a profile."}});

  const clean = url.split("?")[0];
  set({
    cart: [...S.cart, {id:Date.now()+"", type, qty, price, postUrl:clean, shown:clean.replace(/^https?:\/\/(www\.)?instagram\.com\//,"")}],
    open:null, err:null,
  });
  toast(`${num(qty)} ${type} added`);
}

function removeItem(id){ set({cart: S.cart.filter(i=>i.id!==id)}); }

/* ═══════════════════════════════════════════════════════════════════════
   PAGES
   ═══════════════════════════════════════════════════════════════════════ */
function pageFollowers(){
  return `<h1 class="ptitle">Instagram followers</h1>
  <p class="psub">Pick a package, choose which account it goes to, and add it to your cart. You can add more than one account before paying.</p>
  ${grid("followers")}
  ${bulk()}
  ${cartbar()}`;
}

function pageBoost(){
  if (!S.boost){
    const card = (k, icon, blurb) => {
      const lo = Math.min(...Object.values(PRODUCTS[k].tiers));
      return `<button class="choice" onclick="set({boost:'${k}',open:null})">
        <div class="ic">${icon}</div>
        <h3>${PRODUCTS[k].label.replace("Instagram ","")}</h3>
        <p>${blurb}</p>
        <div class="from">From ${money(lo)}</div>
      </button>`;
    };
    return `<h1 class="ptitle">Post Boost</h1>
    <p class="psub">Boost a single post or reel. Choose what you want to add, then paste the link.</p>
    <div class="chooser">
      ${card("likes", I.heart, "Add likes to one post or reel.")}
      ${card("views", I.play,  "Add views to a reel or video.")}
      ${card("shares",I.share, "Add shares to one post or reel.")}
    </div>
    ${bulk()}
    ${cartbar()}`;
  }

  const t = S.boost;
  return `<button class="backlink" onclick="set({boost:null,open:null})">← All Post Boost products</button>
  <h1 class="ptitle">${PRODUCTS[t].label}</h1>
  <p class="psub">Pick a package, then paste the link to the post or reel. It needs to look like instagram.com/p/… or instagram.com/reel/…</p>
  ${grid(t)}
  ${bulk()}
  ${cartbar()}`;
}

function bulk(){
  return `<div class="bulk">
    <div><b>Need a larger order?</b><span>Anything above our biggest package, or a bundle across several accounts, we can quote for.</span></div>
    <a class="btn btn-ghost" href="mailto:${SUPPORT_EMAIL}?subject=Bulk%20order%20enquiry">Email us</a>
  </div>`;
}

function cartbar(){
  if (!S.cart.length) return "";
  return `<div class="cartbar">
    <span>${S.cart.length} item${S.cart.length>1?"s":""} · ${money(total())}</span>
    <button onclick="go('cart')">Review cart</button>
  </div>`;
}

function pageCart(){
  if (!S.cart.length) return `<div class="narrow">
    <h1 class="ptitle">Your cart</h1>
    <div class="empty">
      <div style="color:var(--ink-3)"><svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h2.5l2.2 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 7H5.5"/></svg></div>
      <h3>Nothing here yet</h3>
      <p>Add followers or boost a post to get started.</p>
      <button class="btn btn-primary" onclick="go('followers')">Browse followers</button>
    </div></div>`;

  return `<div class="narrow">
    <h1 class="ptitle">Your cart</h1>
    <p class="psub">${S.cart.length} item${S.cart.length>1?"s":""} ready to order.</p>
    <div class="items">${S.cart.map(i=>`
      <div class="item">
        <div class="ic">${PROD_ICON[i.type]}</div>
        <div class="t"><b>${num(i.qty)} ${i.type==="followers"?"followers":i.type}</b><span>${i.shown}</span></div>
        <div class="pr">${money(i.price)}</div>
        <button class="x" onclick="removeItem('${i.id}')" aria-label="Remove">&times;</button>
      </div>`).join("")}</div>
    <div class="totals">
      ${S.cart.map(i=>`<div class="trow"><span>${num(i.qty)} ${i.type} · ${i.shown}</span><span>${money(i.price)}</span></div>`).join("")}
      <div class="trow"><span>Delivery</span><span>Starts within 24 hours</span></div>
      <div class="trow big"><span>Total</span><span>${money(total())}</span></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="go('followers')">Add more</button>
      <button class="btn btn-primary" style="flex:1" onclick="go('checkout')">Continue to payment</button>
    </div></div>`;
}

function pageCheckout(){
  if (!S.cart.length) { setTimeout(()=>go("cart"),0); return ""; }
  const bad = S.emailErr ? `<div class="bad">${S.emailErr}</div>` : "";
  return `<div class="narrow">
    <h1 class="ptitle">Checkout</h1>
    <p class="psub">One payment. Your order starts within 24 hours of it clearing.</p>

    <div class="card">
      <h3>Order summary</h3>
      ${S.cart.map(i=>`<div class="trow"><span>${num(i.qty)} ${i.type} · ${i.shown}</span><span style="color:var(--ink);font-weight:600">${money(i.price)}</span></div>`).join("")}
      <div class="trow big"><span>Total</span><span>${money(total())}</span></div>
    </div>

    <div class="card">
      <h3>Where should we send the receipt?</h3>
      <div class="field">
        <label for="em">Email address</label>
        <input id="em" type="email" value="${S.email}" placeholder="you@example.com" class="${S.emailErr?"err":""}"
               onkeydown="if(event.key==='Enter')pay()">
        ${bad}
        <div class="hint">Used for your receipt and order reference. Nothing else.</div>
      </div>
    </div>

    <div class="pay">
      <div style="color:var(--grow)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div>
      <div>
        <div style="font-weight:600;font-size:14px;color:var(--grow)">Card payment through Stripe</div>
        <div style="display:flex;gap:5px;margin-top:5px"><span class="pcb v">VISA</span><span class="pcb m">MC</span><span class="pcb a">AMEX</span></div>
      </div>
    </div>
    <div class="note">Have a promo code? You can enter it on the Stripe payment page.</div>

    <button class="btn btn-primary btn-full" onclick="pay()" ${S.busy?"disabled":""}>
      ${S.busy ? '<span class="spin"></span> Opening Stripe…' : "Pay " + money(total())}
    </button>
    <button class="btn btn-ghost btn-full" style="margin-top:9px" onclick="go('cart')">Back to cart</button>
  </div>`;
}

function pageSettings(){
  return `<div class="narrow">
    <h1 class="ptitle">Saved accounts</h1>
    <p class="psub">Add the Instagram accounts you order for and they show up as a dropdown at checkout, so you are not retyping them each time.</p>
    <div class="card">
      <h3>Your accounts</h3>
      ${S.handles.length
        ? `<div class="handles">${S.handles.map(h=>`
            <div class="handle"><b>@${h}</b><button onclick="delHandle('${h}')">Remove</button></div>`).join("")}</div>`
        : `<p style="color:var(--ink-3);margin-bottom:16px">No accounts saved yet. Any username you type when ordering is saved here automatically.</p>`}
      <div class="addrow">
        <input id="newHandle" type="text" placeholder="username" onkeydown="if(event.key==='Enter')addHandle()">
        <button class="btn btn-primary" onclick="addHandle()">Add</button>
      </div>
      ${S.handleErr?`<div class="bad" style="margin-top:8px">${S.handleErr}</div>`:""}
      <div class="hint" style="margin-top:12px">Saved on this device only, in this browser. They are never sent to us until you place an order.</div>
    </div>
  </div>`;
}

function addHandle(){
  const el = document.getElementById("newHandle");
  const h  = cleanUser(el?.value);
  if (!h)                    return set({handleErr:"Type a username first."});
  if (!USERNAME_RE.test(h))  return set({handleErr:"Letters, numbers, dots and underscores only."});
  if (S.handles.includes(h)) return set({handleErr:"That one is already saved."});
  set({handles:[...S.handles, h], handleErr:null});
  toast(`@${h} saved`);
}
function delHandle(h){ set({handles: S.handles.filter(x=>x!==h)}); }

/* ═══════════════════════════════════════════════════════════════════════
   PAY — hands the cart to the server, which prices it and returns a
   Stripe URL. The browser never decides what anything costs.
   ═══════════════════════════════════════════════════════════════════════ */
async function pay(){
  const email = String(document.getElementById("em")?.value || "").trim();
  if (!email)                 return set({emailErr:"We need an email to send your receipt to."});
  if (!EMAIL_RE.test(email))  return set({emailErr:"That does not look like a valid email address."});

  set({email, emailErr:null, busy:true});

  try {
    const res = await fetch("/api/create-checkout", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        email,
        cart: S.cart.map(i => ({type:i.type, qty:i.qty, instagram:i.instagram, postUrl:i.postUrl})),
      }),
    });
    const data = await res.json();
    if (data.url) { store.set("cart", []); window.location.href = data.url; return; }
    set({busy:false});
    toast(data.error || "Could not start checkout. Please try again.");
  } catch {
    set({busy:false});
    toast("Could not reach the server. Check your connection and try again.");
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   BOOT — pull live prices, then draw
   ═══════════════════════════════════════════════════════════════════════ */
(async function(){
  render();
  try {
    const r = await fetch("/api/products");
    const d = await r.json();
    if (d.products) PRODUCTS = d.products;
    if (d.supportEmail) SUPPORT_EMAIL = d.supportEmail;
    render();
  } catch {}
})();
</script>
</body>
</html>
